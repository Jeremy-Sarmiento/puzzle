name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias (pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install flet
          # El punto (.) le dice a pip que instale el proyecto actual y lea el pyproject.toml
          if [ -f pyproject.toml ]; then pip install .; fi

      - name: Construir el APK con Flet
        run: yes | flet build apk

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: Puzzle8x8-APK
          path: build/apk/**/*.apk
